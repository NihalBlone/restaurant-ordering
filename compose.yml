services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant_ordering
      POSTGRES_USER: restaurant_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - restaurant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_app -d restaurant_ordering"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  restaurant_postgres:
